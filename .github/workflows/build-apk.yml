name: Build DualBootPatcherRefreshed APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Typ kompilacji (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-22.04

    env:
      ANDROID_NDK_VERSION: r19c
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}

    steps:
      - name: Checkout DualBootPatcherRefreshed
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            autoconf \
            automake \
            libtool \
            pkg-config \
            python3 \
            python3-pip \
            unzip \
            wget \
            curl \
            git \
            libssl-dev \
            zlib1g-dev \
            liblzma-dev \
            libbz2-dev \
            libzstd-dev \
            libexpat1-dev \
            libjansson-dev \
            libarchive-dev \
            libyaml-cpp-dev \
            ccache

      - name: Setup Android SDK & NDK r19c
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          rm cmdtools.zip

          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;28.0.3"

          cd $HOME
          wget -q https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux-x86_64.zip -O ndk.zip
          unzip -q ndk.zip
          rm ndk.zip

          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-${ANDROID_NDK_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_NDK=$HOME/android-ndk-${ANDROID_NDK_VERSION}" >> $GITHUB_ENV

      - name: Build Thirdparty Libraries from Source (Android arm64-v8a)
        run: |
          mkdir -p $HOME/src-deps
          cd $HOME/src-deps

          wget -q https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          wget -q https://github.com/tukaani-project/xz/releases/download/v5.4.6/xz-5.4.6.tar.gz
          wget -q https://github.com/lz4/lz4/archive/refs/tags/v1.9.4.tar.gz -O lz4-1.9.4.tar.gz
          wget -q https://github.com/libexpat/libexpat/releases/download/R_2_6_2/expat-2.6.2.tar.gz
          wget -q https://github.com/akheron/jansson/releases/download/v2.14/jansson-2.14.tar.gz
          wget -q https://github.com/jbeder/yaml-cpp/archive/refs/tags/yaml-cpp-0.7.0.tar.gz
          wget -q https://www.openssl.org/source/openssl-1.1.1w.tar.gz
          wget -q https://github.com/libarchive/libarchive/releases/download/v3.7.4/libarchive-3.7.4.tar.gz

          for f in *.tar.gz; do tar -xzf "$f"; done

          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          TARGET=aarch64-linux-android
          API=21
          export AR=$TOOLCHAIN/bin/${TARGET}-ar
          export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
          export AS=$CC
          export CXX=$TOOLCHAIN/bin/${TARGET}${API}-clang++
          export LD=$TOOLCHAIN/bin/${TARGET}-ld
          export RANLIB=$TOOLCHAIN/bin/${TARGET}-ranlib
          export STRIP=$TOOLCHAIN/bin/${TARGET}-strip

          PREFIX_ANDROID=$GITHUB_WORKSPACE/thirdparty/built-android-arm64
          mkdir -p $PREFIX_ANDROID/include $PREFIX_ANDROID/lib

          cd $HOME/src-deps/zlib-1.3.1
          CHOST=$TARGET ./configure --prefix=$PREFIX_ANDROID --static
          make -j$(nproc) && make install

          cd $HOME/src-deps/xz-5.4.6
          ./configure --host=$TARGET --prefix=$PREFIX_ANDROID --enable-static --disable-shared --disable-scripts --disable-doc
          make -j$(nproc) && make install

          cd $HOME/src-deps/lz4-1.9.4
          make -j$(nproc) liblz4.a CC=$CC AR=$AR
          cp lib/lz4.h lib/lz4hc.h lib/lz4frame.h $PREFIX_ANDROID/include/
          cp lib/liblz4.a $PREFIX_ANDROID/lib/

          cd $HOME/src-deps/expat-2.6.2
          ./configure --host=$TARGET --prefix=$PREFIX_ANDROID --enable-static --disable-shared --without-docbook
          make -j$(nproc) && make install

          cd $HOME/src-deps/jansson-2.14
          ./configure --host=$TARGET --prefix=$PREFIX_ANDROID --enable-static --disable-shared
          make -j$(nproc) && make install

          cd $HOME/src-deps/yaml-cpp-yaml-cpp-0.7.0
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_INSTALL_PREFIX=$PREFIX_ANDROID \
            -DYAML_CPP_BUILD_TESTS=OFF \
            -DYAML_CPP_BUILD_TOOLS=OFF \
            -DYAML_BUILD_SHARED_LIBS=OFF
          ninja -j$(nproc) && ninja install

          cd $HOME/src-deps/openssl-1.1.1w
          PATH=$TOOLCHAIN/bin:$PATH ./Configure android-arm64 -D__ANDROID_API__=$API no-shared no-tests --prefix=$PREFIX_ANDROID
          PATH=$TOOLCHAIN/bin:$PATH make -j$(nproc) build_libs
          PATH=$TOOLCHAIN/bin:$PATH make install_dev

          cd $HOME/src-deps/libarchive-3.7.4
          CPPFLAGS="-I$PREFIX_ANDROID/include -I$HOME/src-deps/libarchive-3.7.4/contrib/android/include" \
          LDFLAGS="-L$PREFIX_ANDROID/lib" \
            ./configure --host=$TARGET --prefix=$PREFIX_ANDROID \
            --enable-static --disable-shared --disable-bsdtar --disable-bsdcpio --disable-bsdcat --disable-bsdunzip \
            --with-zlib --with-lzma --with-lz4 --with-expat --with-openssl --without-xml2 --without-bz2lib --without-zstd
          make -j$(nproc) && make install

      - name: Auto-patch CMakeLists, Toolchain and Gradle in-memory
        run: |
          python3 - << 'EOF'
          import os, re, glob

          # 1. Ogranicz architektury do arm64-v8a, odblokuj NDK r19c i wylacz Boot UI
          for cmake_file in ["CMakeLists.txt", "android/CMakeLists.txt"]:
              if os.path.exists(cmake_file):
                  with open(cmake_file, "r", encoding="utf-8") as f:
                      content = f.read()
                  content = re.sub(
                      r'set\s*\(\s*ANDROID_ABIS\s+[^)]+\)',
                      'set(ANDROID_ABIS arm64-v8a)',
                      content
                  )
                  content = content.replace(
                      'r18.1.5063045',
                      'r18.1.5063045 r19.2.5345600'
                  )
                  content = re.sub(
                      r'option\s*\(\s*MBP_ENABLE_BOOTUI\s+[^)]+ON\s*\)',
                      'option(MBP_ENABLE_BOOTUI "Enable boot UI" OFF)',
                      content
                  )
                  with open(cmake_file, "w", encoding="utf-8") as f:
                      f.write(content)

          # 2. Napraw duplikaty targetow LibArchive::LibArchive i LibLZMA::LibLZMA w CMake 3.31
          for dep_file in glob.glob("cmake/dependencies/*.cmake"):
              with open(dep_file, "r", encoding="utf-8") as f:
                  dcontent = f.read()
              # Zabezpiecz kazde add_library(... IMPORTED) warunkiem if(NOT TARGET ...)
              dcontent = re.sub(
                  r'(add_library\s*\(\s*([A-Za-z0-9_:.-]+)\s+[^)]*IMPORTED[^)]*\)(?:[\s\S]*?set_target_properties\s*\(\s*\2[\s\S]*?\))?)',
                  r'if(NOT TARGET \2)\n\1\nendif()',
                  dcontent
              )
              with open(dep_file, "w", encoding="utf-8") as f:
                  f.write(dcontent)

          # 3. Wyczysc zaleznosci Boot UI (android-system-core i freetype2), bo Boot UI jest wylaczony
          for bootui_dep in ["cmake/dependencies/android-system-core.cmake", "cmake/dependencies/freetype2.cmake"]:
              if os.path.exists(bootui_dep):
                  with open(bootui_dep, "w", encoding="utf-8") as f:
                      f.write("# Disabled (Boot UI off)\n")

          # 4. Dopisz sciezki find_package do cmake/android.toolchain.cmake
          tc_file = "cmake/android.toolchain.cmake"
          with open(tc_file, "r", encoding="utf-8") as f:
              tc_content = f.read()
          tc_content += """
          list(APPEND CMAKE_FIND_ROOT_PATH "${CMAKE_CURRENT_LIST_DIR}/../thirdparty/built-android-arm64")
          list(APPEND CMAKE_PREFIX_PATH "${CMAKE_CURRENT_LIST_DIR}/../thirdparty/built-android-arm64")
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY BOTH)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE BOTH)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE BOTH)
          """
          with open(tc_file, "w", encoding="utf-8") as f:
              f.write(tc_content)

          # 5. Podmien thirdparty/CMakeLists.txt aby uzywal lokalnie skompilowanych bibliotek
          tp_cmake = "thirdparty/CMakeLists.txt"
          new_tp = """
          cmake_minimum_required(VERSION 3.5)

          set(HOST_PREFIX "/usr")
          set(ANDROID_PREFIX "${CMAKE_CURRENT_SOURCE_DIR}/built-android-arm64")

          if(MBP_BUILD_TARGET STREQUAL "hosttools")
              set(ACTIVE_PREFIX "${HOST_PREFIX}")
          else()
              set(ACTIVE_PREFIX "${ANDROID_PREFIX}")
          endif()

          set(MBP_PREBUILTS_INC_DIR "${ACTIVE_PREFIX}/include" CACHE INTERNAL "")
          set(MBP_PREBUILTS_LIB_DIR "${ACTIVE_PREFIX}/lib" CACHE INTERNAL "")

          include_directories(SYSTEM "${ACTIVE_PREFIX}/include")
          link_directories("${ACTIVE_PREFIX}/lib")
          """
          with open(tp_cmake, "w", encoding="utf-8") as f:
              f.write(new_tp)

          # 6. Zamien jcenter() na mavenCentral() i google() w plikach gradle
          for gfile in glob.glob("**/*.gradle", recursive=True):
              with open(gfile, "r", encoding="utf-8") as f:
                  gcontent = f.read()
              if "jcenter()" in gcontent:
                  gcontent = gcontent.replace("jcenter()", "mavenCentral()\n        google()")
                  with open(gfile, "w", encoding="utf-8") as f:
                      f.write(gcontent)
          EOF

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -G Ninja \
            -DMBP_BUILD_TARGET=android \
            -DMBP_BUILD_TYPE=${BUILD_TYPE} \
            -DMBP_ENABLE_BOOTUI=OFF \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21

      - name: Compile Native Libraries & APK
        run: |
          cd build
          ninja -j$(nproc)
          ninja apk

      - name: Collect APK files
        run: |
          mkdir -p $GITHUB_WORKSPACE/dist
          find build -type f -name "*.apk" -exec cp -v {} $GITHUB_WORKSPACE/dist/ \;
          ls -lh $GITHUB_WORKSPACE/dist/

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DualBootPatcherRefreshed-${{ env.BUILD_TYPE }}-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
