name: Build DualBootPatcherRefreshed APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Typ kompilacji (debug / release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    env:
      ANDROID_NDK_VERSION: r19c
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}

    steps:
      - name: Checkout DualBootPatcherRefreshed
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            unzip \
            wget \
            curl \
            git \
            libssl-dev \
            zlib1g-dev \
            liblzma-dev \
            libbz2-dev \
            libzstd-dev \
            ccache

      - name: Setup Android SDK & NDK r19c
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          rm cmdtools.zip

          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;28.0.3"

          cd $HOME
          wget -q https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux-x86_64.zip -O ndk.zip
          unzip -q ndk.zip
          rm ndk.zip

          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-${ANDROID_NDK_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_NDK=$HOME/android-ndk-${ANDROID_NDK_VERSION}" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -G Ninja \
            -DMBP_BUILD_TARGET=android \
            -DMBP_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21

      - name: Compile Native Libraries & APK
        run: |
          cd build
          ninja -j$(nproc)
          ninja apk

      - name: Collect APK files
        run: |
          mkdir -p $GITHUB_WORKSPACE/dist
          find build -type f -name "*.apk" -exec cp -v {} $GITHUB_WORKSPACE/dist/ \;
          ls -lh $GITHUB_WORKSPACE/dist/

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DualBootPatcherRefreshed-${{ env.BUILD_TYPE }}-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
